# PR Preview: builds both images from the repo root and notifies the
# 7Style Preview Manager. Runs only after the CI workflow is green.
name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PREVIEW_DOMAIN: 7agent.io
  PREVIEW_WEBHOOK_URL: https://agents.7style.net/api/preview-manager/webhook

jobs:
  ci:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-deploy:
    if: github.event.action != 'closed'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      issues: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set lowercase image name
        env:
          REPO: ${{ github.repository }}
        run: echo "IMAGE_NAME=${REPO,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://pr-${{ env.PR_NUMBER }}.${{ env.PREVIEW_DOMAIN }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:pr-${{ env.PR_NUMBER }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:pr-${{ env.PR_NUMBER }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PR title and branch reach the shell only through env: variables; the
      # payload is assembled with jq so quotes in a title cannot break out.
      - name: Deploy Preview
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_FULL_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          WEBHOOK_TOKEN: ${{ secrets.PREVIEW_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_TOKEN" ]; then
            echo "PREVIEW_WEBHOOK_TOKEN secret is not set"; exit 1
          fi
          echo "Deploying preview to pr-${PR_NUMBER}.${PREVIEW_DOMAIN}"
          payload=$(jq -n \
            --arg event deploy \
            --argjson prNumber "$PR_NUMBER" \
            --arg prTitle "$PR_TITLE" \
            --arg prBranch "$PR_BRANCH" \
            --arg prAuthor "$PR_AUTHOR" \
            --arg repoFullName "$REPO_FULL_NAME" \
            --arg imageTag "pr-${PR_NUMBER}" \
            --arg commitSha "$COMMIT_SHA" \
            '$ARGS.named')
          curl --fail-with-body -sS -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WEBHOOK_TOKEN}" \
            --data "$payload" \
            "$PREVIEW_WEBHOOK_URL"

      - name: Comment PR
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: https://pr-${{ env.PR_NUMBER }}.${{ env.PREVIEW_DOMAIN }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployed: ${url}`,
            });

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO_FULL_NAME: ${{ github.repository }}
      WEBHOOK_TOKEN: ${{ secrets.PREVIEW_WEBHOOK_TOKEN }}
    steps:
      - name: Cleanup Preview
        run: |
          if [ -z "$WEBHOOK_TOKEN" ]; then
            echo "PREVIEW_WEBHOOK_TOKEN secret is not set"; exit 1
          fi
          echo "Cleaning up preview for PR #${PR_NUMBER}"
          payload=$(jq -n \
            --arg event cleanup \
            --argjson prNumber "$PR_NUMBER" \
            --arg repoFullName "$REPO_FULL_NAME" \
            '$ARGS.named')
          curl --fail-with-body -sS -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WEBHOOK_TOKEN}" \
            --data "$payload" \
            "$PREVIEW_WEBHOOK_URL"
