name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0
  PNPM_VERSION: 11.26.0

jobs:
  verify:
    name: typecheck, lint, migrate, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bp_ci
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: bp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bp_ci -d bp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://bp_ci:ci-postgres@localhost:5432/bp_ci
      REDIS_URL: redis://:ci-redis@localhost:6379
      CORS_ORIGIN: http://localhost:3010
      NEXT_PUBLIC_API_URL: http://localhost:3011
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Service containers cannot take command arguments and the redis image has
      # no password variable, so Redis 8 starts here with --requirepass.
      - name: Start Redis 8 with password
        run: |
          docker run -d --name ci-redis -p 127.0.0.1:6379:6379 redis:8 \
            redis-server --requirepass ci-redis --appendonly yes --maxmemory-policy noeviction
          for i in $(seq 1 20); do
            if docker exec ci-redis redis-cli -a ci-redis --no-auth-warning ping 2>/dev/null | grep -q PONG; then
              echo "redis ready"; exit 0
            fi
            sleep 1
          done
          echo "redis did not become ready"; docker logs ci-redis; exit 1

      # CI-only secrets, generated per run; nothing secret-looking is committed.
      - name: Generate throwaway application secrets
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "SEED_ADMIN_PASSWORD=$(openssl rand -base64 18)"
          } >> "$GITHUB_ENV"

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm i -g "pnpm@${PNPM_VERSION}"

      - name: Resolve pnpm store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter bp-monolith-backend run prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Prisma migrate deploy (service database)
        run: pnpm --filter bp-monolith-backend run prisma:migrate:deploy

      # Root `pnpm test` = backend Jest (--ci, no watch); the e2e package is
      # excluded there because Playwright needs browsers and a running stack.
      - name: Test
        env:
          NODE_ENV: test
        run: pnpm test

      - name: Build
        run: pnpm build

  security-check:
    name: scripts/security-check.sh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run security check
        run: bash scripts/security-check.sh

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # GITLEAKS_LICENSE is required by gitleaks-action on organisation-owned
      # repositories and ignored (empty) on personal ones; see README "CI".
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Playwright (chromium) against the real stack: the root docker-compose.yml
  # builds both production images, the backend seeds the admin and the demo
  # accounts on start, the suite runs on the runner against the published
  # 127.0.0.1 ports. Values for .env and backend/.env are generated per run.
  e2e:
    name: e2e (Playwright, compose stack)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_URL: http://127.0.0.1:3010
      SEED_ADMIN_EMAIL: admin@bp-monolith.local
      SEED_DEMO_USERS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm i -g "pnpm@${PNPM_VERSION}"

      - name: Resolve pnpm store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (Playwright runner)
        run: pnpm install --frozen-lockfile

      # Throwaway values for this run only (hex, so neither compose nor dotenv
      # interpolates anything). The seed passwords are needed again by the
      # Playwright step and go to GITHUB_ENV, masked in the log.
      - name: Generate stack configuration (.env, backend/.env)
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          REDIS_PASSWORD=$(openssl rand -hex 24)
          SEED_ADMIN_PASSWORD=$(openssl rand -hex 16)
          SEED_DEMO_PASSWORD=$(openssl rand -hex 16)
          for value in "$POSTGRES_PASSWORD" "$REDIS_PASSWORD" "$SEED_ADMIN_PASSWORD" "$SEED_DEMO_PASSWORD"; do
            echo "::add-mask::${value}"
          done
          cat > .env <<EOF
          POSTGRES_USER=bp_e2e
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=bp_e2e
          REDIS_PASSWORD=${REDIS_PASSWORD}
          APP_NAME=bp-monolith
          APP_DESCRIPTION=
          NEXT_PUBLIC_API_URL=http://127.0.0.1:3011
          SEED_ON_START=true
          SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
          SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
          SEED_DEMO_USERS=true
          SEED_DEMO_PASSWORD=${SEED_DEMO_PASSWORD}
          EOF
          cat > backend/.env <<EOF
          JWT_SECRET=$(openssl rand -hex 32)
          JWT_REFRESH_SECRET=$(openssl rand -hex 32)
          SESSION_SECRET=$(openssl rand -hex 32)
          ENCRYPTION_KEY=$(openssl rand -hex 32)
          CORS_ORIGIN=http://127.0.0.1:3010
          FRONTEND_URL=http://127.0.0.1:3010
          API_URL=http://127.0.0.1:3011
          EMAIL_PROVIDER=console
          LOG_LEVEL=info
          # A Playwright retry re-runs a whole serial spec group; the default
          # login limit (5 failed attempts per 15 min and IP) would then block
          # the run. The limiter itself is covered by the backend tests.
          RATE_LIMIT_LOGIN_MAX=100
          EOF
          {
            echo "SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}"
            echo "SEED_DEMO_PASSWORD=${SEED_DEMO_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the backend (/health) and the frontend
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3011/health 2>/dev/null | grep -q '"status":"healthy"'; then
              echo "backend healthy after ${i} tries"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "backend did not become healthy"
              docker compose ps
              docker compose logs --no-color --tail 200 backend
              exit 1
            fi
            sleep 5
          done
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3010/; then
              echo "frontend up after ${i} tries"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "frontend did not answer"
              docker compose ps
              docker compose logs --no-color --tail 200 frontend
              exit 1
            fi
            sleep 5
          done

      - name: Install Chromium
        run: pnpm --filter bp-monolith-e2e exec playwright install --with-deps chromium

      # SEED_ADMIN_EMAIL, SEED_ADMIN_PASSWORD, SEED_DEMO_USERS and
      # SEED_DEMO_PASSWORD come from the job env / GITHUB_ENV above; the
      # fixtures (e2e/fixtures/test-users.ts) derive the accounts from them.
      - name: Playwright (chromium)
        run: pnpm --filter bp-monolith-e2e exec playwright test --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v --remove-orphans
