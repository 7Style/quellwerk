# ==============================================================================
# Quellwerk, Produktion auf "intern"
# ==============================================================================
# Der Server traegt weitere Seiten. Quellwerk ist Gast darauf, daraus folgt alles
# Weitere:
#   - Kein Dienst veroeffentlicht auf 0.0.0.0. Frontend und Backend binden auf
#     127.0.0.1; Postgres und Redis veroeffentlichen gar nichts.
#   - Kein Nginx-Container. TLS und Vhost liegen beim Nginx des Hosts
#     (deployment/prod/nginx/quellwerk.conf), sonst streiten sich zwei Prozesse
#     um 80 und 443.
#   - Bridge-Name und Subnetz stehen fest, damit die Firewall-Regeln nicht an
#     einem zufaelligen br-1a2b3c haengen (SECURITY.md 4.3).
#
# Start:
#   cd /apps/quellwerk
#   docker compose -f deployment/prod/docker/docker-compose.yml --env-file .env up -d --build
#
# Variablen kommen aus /apps/quellwerk/.env und /apps/quellwerk/backend/.env.
# Beide werden auf dem Server von Hand geschrieben und nie aus dem Repository
# kopiert.
# ==============================================================================

# Fester Projektname. Ohne ihn nimmt Compose den Ordnernamen "docker", den auf
# einem geteilten Server auch andere Stacks tragen koennen.
name: quellwerk-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    image: postgres:17-alpine
    container_name: quellwerk-prod-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB fehlt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    logging: *default-logging

  redis:
    image: redis:8-alpine
    container_name: quellwerk-prod-redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD fehlt}
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Der Entrypoint wechselt per su-exec auf den Nutzer redis, dem /data gehoert.
    cap_add:
      - SETGID
      - SETUID
    logging: *default-logging

  backend:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
    image: quellwerk-backend:prod
    container_name: quellwerk-prod-backend
    ports:
      - '127.0.0.1:3021:3011'
    env_file:
      - ../../../backend/.env
    environment:
      NODE_ENV: production
      PORT: 3011
      APP_NAME: ${APP_NAME:-Quellwerk}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      UPLOAD_DIR: /usr/src/app/uploads
      TRUST_PROXY: 1
      PUBLIC_URL: https://${PROD_DOMAIN:?PROD_DOMAIN fehlt}
      CORS_ORIGIN: https://${PROD_DOMAIN}
      FRONTEND_URL: https://${PROD_DOMAIN}
      API_URL: https://${PROD_DOMAIN}
      # Seeding ist in production abgeschaltet; das Demo-Notizbuch wird bewusst
      # mit einem eigenen Befehl gesetzt (M8-T1).
      SEED_ON_START: 'false'
    volumes:
      - backend_uploads:/usr/src/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      # 120s statt 40s: beim allerersten Start laeuft `prisma migrate deploy`
      # im Entrypoint, bevor der Server lauscht. Auf einem geteilten Server mit
      # kalter Platte reichten 40s nicht, der Container galt als unhealthy und
      # der Worker startete nie (er wartet auf service_healthy). Ein grosses
      # Startfenster kostet nichts: fehlgeschlagene Versuche darin zaehlen nicht
      # gegen `retries`, und ein erfolgreicher beendet es sofort.
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  worker:
    # Kein eigener `build`: der Worker ist derselbe Code wie das Backend, nur mit
    # einem anderen Startbefehl. `backend` baut das Image und vergibt den Tag,
    # der Worker benutzt ihn. Ein zweiter Build-Eintrag mit demselben Kontext
    # und demselben Tag baut dieselbe Schicht ein zweites Mal.
    # Das setzt voraus, dass der Tag vorhanden ist: immer `up -d --build`
    # aufrufen (so steht es in deploy.sh), nie `up -d worker` allein auf einem
    # Server, auf dem noch nie gebaut wurde.
    image: quellwerk-backend:prod
    container_name: quellwerk-prod-worker
    command: ['node', 'dist/app/worker.js']
    env_file:
      - ../../../backend/.env
    environment:
      NODE_ENV: production
      APP_NAME: ${APP_NAME:-Quellwerk}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      UPLOAD_DIR: /usr/src/app/uploads
      # Migrationen laufen im Backend-Container, nie zweimal.
      SEED_ON_START: 'false'
    volumes:
      - backend_uploads:/usr/src/app/uploads
    # Der Healthcheck aus dem Dockerfile ruft /health; der Worker bedient nichts
    # und waere damit dauerhaft unhealthy. Eine echte Lebendpruefung kommt mit
    # dem ersten Prozessor in M2-T2 ueber einen Heartbeat in Redis.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  frontend:
    build:
      context: ../../..
      dockerfile: frontend/Dockerfile
      args:
        # NEXT_PUBLIC_* wird beim Build eingebrannt; als environment zur Laufzeit
        # waere es wirkungslos. Nach einer Aenderung muss das Image neu gebaut
        # werden.
        NEXT_PUBLIC_API_URL: https://${PROD_DOMAIN}
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-Quellwerk}
        NEXT_PUBLIC_APP_DESCRIPTION: ${APP_DESCRIPTION:-}
    image: quellwerk-frontend:prod
    container_name: quellwerk-prod-frontend
    ports:
      - '127.0.0.1:3020:3000'
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  internal:
    # Name fest, weil quellwerk-firewall.sh auf genau dieses Netz wartet.
    name: quellwerk_internal
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-quellwerk
    ipam:
      config:
        - subnet: 172.30.0.0/24
