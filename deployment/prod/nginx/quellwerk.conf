# ==============================================================================
# Quellwerk, vhost fuer den Nginx des Hosts auf "intern"
#
# Ablage:  /etc/nginx/sites-available/quellwerk.conf
# Aktiv:   ln -s ../sites-available/quellwerk.conf /etc/nginx/sites-enabled/
#
# Vor dem ersten certbot-Lauf existiert nur der Port-80-Server. Hier steht
# bewusst kein ssl_certificate: ein Pfad auf eine Datei, die es noch nicht gibt,
# laesst nginx -t scheitern und blockiert den gesamten Host, auf dem andere
# Seiten laufen.
#
# Das Zertifikat wird mit `certbot certonly --webroot -w /var/www/html` geholt,
# NICHT mit `certbot --nginx`. Der nginx-Installer baut den 443-Block, indem er
# den vorhandenen 80-Block dupliziert; dessen location / ist eine Umleitung nach
# https, die Kopie zeigte also auf sich selbst. Mit certonly fasst certbot diese
# Datei gar nicht an, und der TLS-Block unten wird von Hand einkommentiert.
#
# Zwei Anwendungen hinter einem Namen:
#   /api  -> Backend  auf 127.0.0.1:3021
#   /     -> Frontend auf 127.0.0.1:3020
# ==============================================================================

# Die aeussere Schranke aus SECURITY.md 5. Die Anwendung begrenzt pro Session
# (30 Chat-Turns je Stunde) und pro IP; das hier greift davor und ohne Cookie,
# also auch gegen einen Client, der bei jedem Versuch eine neue Session nimmt.
#
# 10 r/s mit burst=30 ist keine Sparmassnahme: ein Chat-Turn ist eine lange
# offene Verbindung, und dreissig davon gleichzeitig sind dreissig Modellaufrufe,
# die das Tagesbudget in einer Minute aufbrauchen. nodelay laesst die ersten
# dreissig sofort durch und bremst erst danach, damit ein normaler Seitenaufruf
# mit seinen vielen kleinen Anfragen nichts merkt.
limit_req_zone $binary_remote_addr zone=quellwerk_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=quellwerk_conn:10m;

upstream quellwerk_backend {
    server 127.0.0.1:3021;
    keepalive 16;
}

upstream quellwerk_frontend {
    server 127.0.0.1:3020;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name quellwerk.7style.net;

    # certbot legt hier seine Challenge ab und ersetzt den Rest dieses Blocks
    # spaeter durch die Umleitung auf https.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# Nur solange es kein Zertifikat gibt: derselbe Proxy, ohne TLS, ausschliesslich
# auf dem Loopback.
#
# Der Grund ist der Chat. Buffering-Fehler zeigen sich erst hinter dem Proxy, und
# bis der A-Record steht, ist der einzige aktive Block oben der auf Port 80, der
# alles nach https umleitet - es gibt also keinen Weg, ueber den eine SSE-Antwort
# durch nginx laufen koennte. Die Direktiven unten sind Zeile fuer Zeile die aus
# dem 443-Block, damit der Test die Konfiguration prueft, die spaeter wirklich
# laeuft.
#
# 127.0.0.1 und kein ::, weil nichts auf 0.0.0.0 gehoert (SECURITY.md 4).
# Ist 8081 auf dem Host belegt, eine freie Nummer nehmen; dieser Block faellt
# weg, sobald der 443-Block aktiv ist (docs/DEPLOY.md, Schritt 9).
#
#     curl -N -H 'Host: quellwerk.7style.net' \
#          -X POST http://127.0.0.1:8081/api/notebooks/<id>/chat \
#          -H 'Content-Type: application/json' -d '{"question":"..."}'
#
# Erwartet: die Ereignisse tropfen einzeln ein. Kommt alles auf einmal, puffert
# etwas, und dann ist es nginx und nicht das Backend.
# ------------------------------------------------------------------------------
server {
    listen 127.0.0.1:8081;
    server_name _;

    client_max_body_size 25m;

    location /api/ {
        limit_req zone=quellwerk_api burst=30 nodelay;
        # Ein Browser haelt einen SSE-Stream offen. Acht davon je IP sind mehr,
        # als ein Mensch mit Tabs erzeugt, und weniger, als ein Skript braucht.
        limit_conn quellwerk_conn 8;

        proxy_pass http://quellwerk_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        gzip off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://quellwerk_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

