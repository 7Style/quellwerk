# ==============================================================================
# Quellwerk, vhost fuer den Nginx des Hosts auf "intern"
#
# Ablage:  /etc/nginx/sites-available/quellwerk.conf
# Aktiv:   ln -s ../sites-available/quellwerk.conf /etc/nginx/sites-enabled/
#
# Vor dem ersten certbot-Lauf existiert nur der Port-80-Server. Hier steht
# bewusst kein ssl_certificate: ein Pfad auf eine Datei, die es noch nicht gibt,
# laesst nginx -t scheitern und blockiert den gesamten Host, auf dem andere
# Seiten laufen.
#
# Das Zertifikat wird mit `certbot certonly --webroot -w /var/www/html` geholt,
# NICHT mit `certbot --nginx`. Der nginx-Installer baut den 443-Block, indem er
# den vorhandenen 80-Block dupliziert; dessen location / ist eine Umleitung nach
# https, die Kopie zeigte also auf sich selbst. Mit certonly fasst certbot diese
# Datei gar nicht an, und der TLS-Block unten wird von Hand einkommentiert.
#
# Zwei Anwendungen hinter einem Namen:
#   /api  -> Backend  auf 127.0.0.1:3021
#   /     -> Frontend auf 127.0.0.1:3020
# ==============================================================================

upstream quellwerk_backend {
    server 127.0.0.1:3021;
    keepalive 16;
}

upstream quellwerk_frontend {
    server 127.0.0.1:3020;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name quellwerk.7style.net;

    # certbot legt hier seine Challenge ab und ersetzt den Rest dieses Blocks
    # spaeter durch die Umleitung auf https.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

