# quellwerk - Domains je Umgebung
# ==================================
# Referenz. Die Compose-Dateien lesen die Werte aus .env (siehe example.env):
# LOCAL_DOMAIN, DEV_DOMAIN, PROD_DOMAIN, LETSENCRYPT_EMAIL.

LOCAL_DOMAIN=bp-local.7style.net
DEV_DOMAIN=bp-dev.7style.net
PROD_DOMAIN=bp-prod.7style.net

# TLS: LOCAL selbstsigniert (Nginx-Entrypoint), DEV/PROD Let's Encrypt
LETSENCRYPT_EMAIL=admin@7style.net

# Container-Präfixe (name: in den Compose-Dateien)
CONTAINER_PREFIX_LOCAL=bp-local
CONTAINER_PREFIX_DEV=bp-dev
CONTAINER_PREFIX_PROD=bp-prod
