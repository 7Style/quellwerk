packages:
  - backend
  - frontend
  - e2e

catalog:
  typescript: 6.0.3
  '@types/node': 24.13.3
  prettier: 3.9.6

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
  '@tailwindcss/oxide': true
  unrs-resolver: true
  '@playwright/test': true
  playwright: true
  # Reported by pnpm 11 as ignored build scripts on the first install; each one
  # checked and denied on purpose:
  #   @parcel/watcher  install script is a no-op unless npm_config_build_from_source
  #                    is set; the prebuilt @parcel/watcher-<platform> package is used
  #   @scarf/scarf     postinstall is telemetry (report.js)
  #   core-js          postinstall only prints a funding banner
  '@parcel/watcher': false
  '@scarf/scarf': false
  core-js: false

# lucide-react 1.43.0 (2026-09-08) is younger than pnpm's default minimumReleaseAge;
# the version is fixed by docs/UPGRADE-2026-09.md, so it is excluded from the age gate.
minimumReleaseAgeExclude:
  - lucide-react@1.43.0

# Advisories that reach the tree only through the prisma CLI (a production
# dependency so that `migrate deploy` runs in the image); none of the code runs
# at request time. Re-check with `pnpm audit --prod` after every prisma bump.
#   lodash        GHSA-r5fr-rjxr-66jc via @prisma/studio-core > @visx; the
#                 dependents declare ^4.17.21, 4.18.1 is within that range
#   deepmerge-ts  GHSA-ggr8-5vv4-36mx via @prisma/config (pins 7.1.5); it only
#                 calls deepmerge() on plain config objects, the 8.0 changes
#                 concern Map merging and two type names
#   mysql2        GHSA-3f6p-5ww8-9rcr; the CLI loads it lazily for MySQL
#                 (Studio) only, Postgres is the only datasource here, so the
#                 package is removed from prisma's dependencies
#
# @napi-rs/canvas is an optional dependency of pdfjs-dist and a prebuilt native
# binary per platform. It is only used to rasterise a page; text extraction
# never touches it. Removed so the backend image stays free of a binary nothing
# calls.
overrides:
  lodash: 4.18.1
  deepmerge-ts: 8.0.2
  'prisma>mysql2': '-'
  'pdfjs-dist>@napi-rs/canvas': '-'
